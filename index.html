<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Aurish &amp; Nick</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@1,600&family=Lora:wght@500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" onerror="this.onerror=null;this.href='style.css'">
</head>

<body>
  <!-- Icon library (used by the background decorations) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-ribbon" viewBox="0 0 24 24">
      <path d="M12 3.2c-2.6 0-4.4 1.9-4.4 4.2 0 3.2 2.8 5.6 5 8.4"/>
      <path d="M12 3.2c2.6 0 4.4 1.9 4.4 4.2 0 3.2-2.8 5.6-5 8.4"/>
      <path d="M10.2 13.3 6.2 19.4a1.2 1.2 0 0 0 2 1.3l4.3-5.6"/>
      <path d="m13.8 13.3 4 6.1a1.2 1.2 0 0 1-2 1.3l-4.3-5.6"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
      <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
    </symbol>
  </svg>

  <!-- ========== BACKGROUND (fixed: gradient + dots + wavy edges + icons) ========== -->
  <div class="bg-fixed" aria-hidden="true">
    <svg class="wave wave-l" viewBox="0 0 72 800" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="800">
          <stop offset="0" stop-color="#f4d6ea"/>
          <stop offset=".25" stop-color="#f0d6ec"/>
          <stop offset=".56" stop-color="#eed4ee"/>
          <stop offset=".82" stop-color="#e8d3f2"/>
          <stop offset="1" stop-color="#e8d3f2"/>
        </linearGradient>
        <path id="wp" d="M0 -21H52.5C52.5 24 19.7 81 19.7 125C19.7 201 64.7 195 64.7 271C64.7 315 26.2 384 26.2 428C26.2 510 70.4 505 70.4 588C70.4 661 30.7 730 30.7 804V820H0V682C0 655 9 640 9 615V590C9 568 0 565 0 545V312C0 295 3.7 285 3.7 272C3.7 258 0 252 0 243Z"/>
      </defs>
      <use href="#wp" fill="url(#wg)"/>
    </svg>
    <svg class="wave wave-r" viewBox="0 0 72 800" preserveAspectRatio="none">
      <use href="#wp" fill="url(#wg)"/>
    </svg>

    <svg class="dc d1"><use href="#i-heart"/></svg>
    <svg class="dc d2"><use href="#i-heart"/></svg>
    <svg class="dc d3"><use href="#i-ribbon"/></svg>
    <svg class="dc d4"><use href="#i-heart"/></svg>
    <svg class="dc d5"><use href="#i-spark"/></svg>
    <svg class="dc d6"><use href="#i-heart"/></svg>
    <svg class="dc d7"><use href="#i-spark"/></svg>
    <svg class="dc d8"><use href="#i-ribbon"/></svg>
  </div>

  <main>

    <!-- ========== 1. DAYS RING ========== -->
    <section class="hero">
      <svg class="ring" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eebcde"/>
            <stop offset="1" stop-color="#d6bdf1"/>
          </linearGradient>
        </defs>
        <circle cx="120" cy="120" r="100"/>
        <circle class="rim" cx="120" cy="120" r="107"/>
        <circle class="rim" cx="120" cy="120" r="93"/>
      </svg>
      <div class="ct">
        <span>It’s been</span>
        <strong id="days">0</strong>
        <span>days</span>
      </div>
    </section>

    <!-- ========== 2. AVATARS ========== -->
    <section class="pair">
      <div class="who" data-ig="aurish">
        <div class="av">A<img src="avatars/aurish.png" alt="" onerror="this.remove()"></div>
        Aurish
      </div>

      <div class="beat">♥</div>

      <div class="who" data-ig="nick">
        <div class="av">N<img src="avatars/nick.png" alt="" onerror="this.remove()"></div>
        Nick
      </div>
    </section>

    <p class="since">Together since October 13, 2025</p>

    <!-- ========== 3. ALBUM CALENDAR (with 4 sticker placeholders) ========== -->
    <section class="album">
      <!-- PUT YOUR STICKERS HERE: just drop the png files into the stickers/ folder -->
      <img class="stk stk-bow"    src="stickers/bow.png"     alt="" onerror="this.remove()">
      <img class="stk stk-heart"  src="stickers/heart.png"   alt="" onerror="this.remove()">
      <img class="stk stk-flower" src="stickers/flower.png" alt="" onerror="this.remove()">
      <img class="stk stk-spark" src="stickers/spark.png"  alt="" onerror="this.remove()">

      <h2>Our album</h2>
      <p class="cnt" id="cnt" aria-live="polite"></p>

      <div class="nav">
        <div>
          <button data-s="-12" aria-label="Previous year">«</button>
          <button data-s="-1" aria-label="Previous month">‹</button>
        </div>
        <button id="cm" class="cm" aria-label="Back to this month"></button>
        <div>
          <button data-s="1" aria-label="Next month">›</button>
          <button data-s="12" aria-label="Next year">»</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <p class="hint">Tap a glowing ♥ to open that day’s picture</p>
    </section>

  </main>


  <!-- ========== 4. DRAGGABLE MUSIC PLAYER ========== -->
  <div class="wg" id="mw">
    <div class="stage">
      <div class="art">
        <div class="ph-art">
          <span class="note">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </span>
          <small id="hint"></small>
        </div>
        <img id="cv" alt="" hidden>
        <div class="eq"><i></i><i></i><i></i><i></i></div>
      </div>

      <ol class="list" id="list" data-nodrag hidden></ol>
      <button class="lbtn" id="lb" data-nodrag aria-label="Show the playlist" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
      </button>
    </div>

    <div class="meta">
      <b id="tt">Our Song</b>
      <small id="ta"></small>
    </div>
    <p class="msg" id="msg" hidden></p>

    <input id="sk" type="range" min="0" max="100" step=".1" value="0" data-nodrag aria-label="Seek">

    <div class="tm">
      <span id="tc">0:00</span>
      <span id="tr">-0:00</span>
    </div>

    <div class="ctl" data-nodrag>
      <button id="sh" class="sm" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      </button>
      <button id="rw" aria-label="Previous">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
      </button>
      <button id="pp" aria-label="Play or pause">
        <svg class="pl" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <svg class="pa" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button id="fw" aria-label="Next">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
      </button>
      <button id="rp" class="sm on" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>


  <!-- ========== 5. DRAGGABLE ENVELOPE ========== -->
  <div class="wg" id="ew" role="button" tabindex="0" aria-label="Open the love letter">
    <div class="glow"></div>
    <div class="env">
      <div class="back"></div>
      <div class="paper">♥</div>
      <div class="front">
        <span class="to">To my love</span>
        <span class="stamp">♥</span>
      </div>
      <div class="flap"><i class="fo"></i><i class="fi"></i></div>
      <div class="seal">♥</div>
    </div>
  </div>

  <!-- Popup overlay -->
  <div id="ov"><div id="box"></div></div>

  <script src="js/script.js" onerror="var s=document.createElement('script');s.src='script.js';document.body.append(s)"></script>
</body>
</html>

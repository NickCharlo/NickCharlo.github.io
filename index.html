<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aurish &amp; Nick</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@1,600&family=Lora:wght@500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <!-- if the css folder is missing (files uploaded flat), it falls back to style.css next to this file -->
  <link rel="stylesheet" href="css/style.css" onerror="this.onerror=null;this.href='style.css'">
</head>

<body>
  <main>

    <!-- ========== 1. DAYS RING ========== -->
    <section class="hero">
      <svg class="ring" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f2a9c6"/>
            <stop offset="1" stop-color="#b9a6ee"/>
          </linearGradient>
        </defs>
        <circle cx="120" cy="120" r="100"/>
      </svg>
      <div class="ct">
        <span>It’s been</span>
        <strong id="days">0</strong>
        <span>days</span>
      </div>
    </section>

    <section class="photo-showcase">
      <img src="6.png" alt="Memory photo" class="feature-photo">
    </section>

    <!-- ========== 2. AVATARS (pictures go in the "avatars" folder) ========== -->
    <section class="pair">
      <div class="who" data-ig="aurish">
        <div class="av">A<!-- PLACEHOLDER: Aurish's picture is avatars/aurish.png --><img src="avatars/aurish.png" alt="" onerror="this.remove()"></div>
        Aurish
      </div>

      <div class="beat">♥</div>

      <div class="who" data-ig="nick">
        <div class="av">N<!-- PLACEHOLDER: Nick's picture is avatars/nick.png --><img src="avatars/nick.png" alt="" onerror="this.remove()"></div>
        Nick
      </div>
    </section>

    <p class="since">Together since October 13, 2025</p>

    <!-- ========== 3. ALBUM CALENDAR (the calendar itself is drawn by js/script.js) ========== -->
    <section class="album">
      <h2>Our album</h2>

      <div class="nav">
        <div>
          <button data-s="-12" aria-label="Previous year">«</button>
          <button data-s="-1" aria-label="Previous month">‹</button>
        </div>
        <button id="cm" class="cm" aria-label="Back to this month"></button>
        <div>
          <button data-s="1" aria-label="Next month">›</button>
          <button data-s="12" aria-label="Next year">»</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <p class="hint">Tap a ♥ to open that day’s photo</p>
    </section>

    <!-- ========== 3b. TRAVEL LOG: "our date map" (places: js/script.js > PLACES) ========== -->
    <section class="trip">
      <h2>Our date map</h2>
      <p class="sub" id="tripSub"></p>
      <div class="map" id="tripMap"></div>
      <p class="hint">Tap a pin to see the memory</p>
    </section>

  </main>


  <!-- ========== 4. DRAGGABLE MUSIC PLAYER (your songs: js/script.js > TRACKS) ========== -->
  <div class="wg" id="mw">
    <div class="stage">
      <div class="art">
        <div class="ph-art">
          <span class="note">♪</span>
          <small id="hint"></small>
        </div>
        <img id="cv" alt="" hidden>
        <div class="eq"><i></i><i></i><i></i><i></i></div>
      </div>

      <!-- playlist (opens over the picture) -->
      <ol class="list" id="list" data-nodrag hidden></ol>
      <button class="lbtn" id="lb" data-nodrag aria-label="Show the playlist" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      </button>
    </div>

    <div class="meta">
      <b id="tt">Our Song</b>
      <small id="ta"></small>
    </div>
    <p class="msg" id="msg" hidden></p>

    <input id="sk" type="range" min="0" max="100" step=".1" value="0" data-nodrag aria-label="Seek">

    <div class="tm">
      <span id="tc">0:00</span>
      <span id="tr">-0:00</span>
    </div>

    <div class="ctl" data-nodrag>
      <button id="sh" class="sm" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4-1.4 1.4 3.1 3.1-2 2H20v-5.5l-2 2-3.2-3z"/></svg>
      </button>
      <button id="rw" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg>
      </button>
      <button id="pp" aria-label="Play or pause">
        <svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pa" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button id="fw" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6zm9-12v12l8.5-6z"/></svg>
      </button>
      <button id="rp" class="sm on" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      </button>
    </div>
  </div>


  <!-- ========== 5. DRAGGABLE ENVELOPE (letter text: js/script.js > LETTER) ========== -->
  <div class="wg" id="ew" role="button" tabindex="0" aria-label="Open the love letter">
    <div class="glow"></div>
    <div class="env">
      <div class="back"></div>
      <div class="paper">♥</div>
      <div class="front">
        <span class="to">To my love</span>
        <span class="stamp">♥</span>
      </div>
      <div class="flap"><i class="fo"></i><i class="fi"></i></div>
      <div class="seal">♥</div>
    </div>
  </div>


  <!-- popup used by the photo card and the A4 letter -->
  <div id="ov"><div id="box"></div></div>

  <!-- same fallback for the script: js/script.js first, then script.js next to this file -->
  <script src="js/script.js" onerror="var s=document.createElement('script');s.src='script.js';document.body.append(s)"></script>
</body>
</html>
